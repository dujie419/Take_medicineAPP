services:
  mysql:
    image: mysql:8.0
    container_name: take_medicine_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: take_medicine
      MYSQL_USER: take_user
      MYSQL_PASSWORD: take_pass123
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    command:
      [
        "--character-set-server=utf8mb4",
        "--collation-server=utf8mb4_unicode_ci",
        "--default-time-zone=+08:00"
      ]
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: